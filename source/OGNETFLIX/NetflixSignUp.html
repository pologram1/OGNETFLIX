<!-- Server registration form; posts account fields to addUser.jsp. -->
<html>
	<head>
		<title>OG Netflix - Sign Up</title>
	</head>
	<body>
		<h1>Netflix</h1>
		<form id="form_1" action="addUser.jsp" method="post">
			<table border="0">
				<tr>
					<td> Username </td>
					<td><input type="text" id="userName"  name="userName" required /></td>
				</tr>
				<tr>
					<td> Password </td>
					<td><input type="password" id="userPass"  name="userPass" required />
				</tr>
				<tr>
					<td> Name </td>
					<td><input type="text" id="completeName"  name="completeName" required />
				</tr>
				<tr>
					<td> Telephone </td>
					<td><input type="text" id="telephone"  name="telephone" required />
				</tr>
			</table>
			<input type="submit" id="Submit" value="submit" />
			<input type="reset" id="Submit" value="reset" />
		</form>
		<p>Already have an account?</p>
		<a href="Netflixlogin.html">Back to Login</a>
	</body>
</html>
